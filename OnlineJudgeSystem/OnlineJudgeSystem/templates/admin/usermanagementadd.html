{% extends "adminLayout.html" %}

{% block content %}





<div class="container-fluid">
    <div class="row">
        <!-- main title -->
        <div class="col-12">
            <div class="main__title">
                <h2> 添加学生 </h2>
            </div>
        </div>

        <!-- end main title -->


        <!-- form -->
                <div class="col-12">
                        <style>
                            .form-label { color: #fff !important; }
                            .sign__input, .form-select { color: #fff !important; }
                            .sign__input::placeholder { color: rgba(255,255,255,0.7); }
                            #status,
                            #status option { color:#fff !important; background-color:#1f1f26 !important; }
                            #status { border-color: rgba(255,255,255,0.2) !important; }
                        </style>
                        <form  action="/usermanagementadd" method="post" class="sign__form sign__form--add">

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">用户名称</label>
                            <input style="width:100%" placeholder="请输入登录用户名" name="username" type="text" class="sign__input" required>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">登录密码</label>
                            <input style="width:100%" placeholder="请输入初始密码" name="pwd" type="text" class="sign__input" required>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">学生姓名</label>
                            <input style="width:100%" placeholder="请输入学生姓名" name="name" type="text" class="sign__input" required>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">所属学校</label>
                                <input style="width:100%" placeholder="请输入学校名称" name="school_name" id="schoolName" type="text" class="sign__input" required>
                                <input type="hidden" name="school_id" id="schoolIdHidden" value="">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">所属班级</label>
                                <input style="width:100%" placeholder="请输入班级名称" name="class_name" id="className" type="text" class="sign__input" required>
                                <input type="hidden" name="class_id" id="classIdHidden" value="">
                                <input type="hidden" name="classes" id="classesInput" value="">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">学籍状态</label>
                            <select class="form-select" name="status" id="status" required>
                                <option value="1" selected>在读</option>
                                <option value="0">停用</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">学号</label>
                            <input style="width:100%" placeholder="请输入学号" name="card" type="text" class="sign__input" required>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">联系电话</label>
                            <input style="width:100%" placeholder="请输入手机号" name="phone" type="text" class="sign__input" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="sign__group">
                            <label class="form-label">联系地址</label>
                            <input style="width:100%" placeholder="请输入联系地址" name="address" type="text" class="sign__input">
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="sign__btn sign__btn--small"><span>添加学生</span></button>
                    </div>
                </div>

            </form>
        </div>
        <!-- end form -->
    </div>
</div>

 
<script>
(function() {
    // 将手工输入的班级名称同步到隐藏的 classes 字段，便于后端保存
    const className = document.getElementById('className');
    const classesInput = document.getElementById('classesInput');
    if (className && classesInput) {
      const sync = () => { classesInput.value = className.value.trim(); };
      className.addEventListener('input', sync);
      sync();
    }
})();
</script>






{% endblock %}
