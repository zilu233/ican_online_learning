{% extends 'adminLayout.html' %}
{% block title %}教师审核{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">教师审核</h4>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="row g-3 align-items-end mb-3">
        <div class="col-md-3">
          <label class="form-label">学校</label>
          <select class="form-select" id="schoolFilter"></select>
        </div>
        <div class="col-auto">
          <button class="btn btn-secondary" id="btnRefresh">刷新</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle" id="tblTeachers">
          <thead>
            <tr>
              <th>用户名</th>
              <th>姓名</th>
              <th>学校</th>
              <th>电话</th>
              <th>地址</th>
              <th style="width: 220px;">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 审核 模态框 -->
<div class="modal fade" id="approveModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">审核教师</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="approveTeacherId">
        <div class="mb-3">
          <label class="form-label">审核结果</label>
          <select class="form-select" id="approveStatus">
            <option value="1">通过</option>
            <option value="2">拒绝</option>
          </select>
        </div>
        <div class="mb-3" id="reasonWrap" style="display:none;">
          <label class="form-label">拒绝原因</label>
          <textarea class="form-control" id="approveReason" rows="3" placeholder="可选"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" id="btnApproveSubmit">提交</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const $tbl = $('#tblTeachers tbody');
  let approveModal;

  function loadSchools() {
    fetch('/api/schools/all_active').then(r => r.json()).then(res => {
      const $sel = $('#schoolFilter');
      $sel.empty();
      $sel.append('<option value="">全部学校</option>');
      if (res.code === 1) {
        (res.data||[]).forEach(s => $sel.append(`<option value="${s.id}">${s.school_name}</option>`));
      }
    });
  }

  function loadPending() {
    const schoolId = $('#schoolFilter').val();
    const url = '/api/teachers/pending' + (schoolId? ('?school_id='+schoolId):'');
    fetch(url).then(r => r.json()).then(res => {
      if (res.code !== 1) { alert(res.msg || '加载失败'); return; }
      renderTable(res.data||[]);
    });
  }

  function renderTable(list) {
    $tbl.empty();
    list.forEach(item => {
      const tr = `
      <tr>
        <td>${item.username||''}</td>
        <td>${item.name||''}</td>
        <td>${item.school_name||''}</td>
        <td>${item.phone||''}</td>
        <td>${item.address||''}</td>
        <td>
          <button class="btn btn-sm btn-success me-1" onclick="openApprove(${item.id},1)">通过</button>
          <button class="btn btn-sm btn-danger" onclick="openApprove(${item.id},2)">拒绝</button>
        </td>
      </tr>`;
      $tbl.append(tr);
    });
  }

  window.openApprove = function(id, status) {
    $('#approveTeacherId').val(id);
    $('#approveStatus').val(status);
    $('#reasonWrap').toggle(status==2);
    approveModal = new bootstrap.Modal(document.getElementById('approveModal'));
    approveModal.show();
  }

  $('#approveStatus').on('change', function(){
    $('#reasonWrap').toggle($(this).val()=='2');
  });

  $('#btnApproveSubmit').on('click', function(){
    const teacher_id = parseInt($('#approveTeacherId').val(),10);
    const status = parseInt($('#approveStatus').val(),10);
    const reason = $('#approveReason').val().trim();
    if (!teacher_id) return;
    if (status === 2 && !reason) { alert('请填写拒绝原因'); return; }

    fetch('/api/teachers/approve', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ teacher_id, status, reason })
    }).then(r => r.json()).then(res => {
      if (res.code === 1) { approveModal.hide(); loadPending(); }
      else { alert(res.msg || '审核失败'); }
    });
  });

  $('#btnRefresh').on('click', loadPending);
  $('#schoolFilter').on('change', loadPending);

  loadSchools();
  loadPending();
})();
</script>
{% endblock %}
