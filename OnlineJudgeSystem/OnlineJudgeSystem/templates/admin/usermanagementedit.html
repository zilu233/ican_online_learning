{% extends "adminLayout.html" %}

{% block content %}





<div class="container-fluid">
    <div class="row">
        <!-- main title -->
        <div class="col-12">
            <div class="main__title">
                <h2> 编辑学生 </h2>
            </div>
        </div>

        <!-- end main title -->


        <!-- form -->
                <div class="col-12">
                                    <style>
                                        .form-label { color: #fff !important; }
                                        .sign__input, .form-select { color: #fff !important; }
                                        .sign__input::placeholder { color: rgba(255,255,255,0.7); }
                                        /* 统一“学籍状态”下拉样式与输入框一致 */
                                        #status,
                                        #status option {
                                            color: #fff !important;
                                            background-color: #1f1f26 !important;
                                        }
                                        #status { border-color: rgba(255,255,255,0.2) !important; }
                                    </style>
                        <form  action="/usermanagementedit" method="post" class="sign__form sign__form--add">

                <div class="row g-3">
                    <input name="Id" value="{{data.Id}}" type="hidden" />

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">用户名称</label>
                            <input style="width:100%" readonly value="{{data.UserName}}" name="username" type="text" class="sign__input">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">登录密码</label>
                            <input style="width:100%" value="{{data.PWD}}" name="pwd" type="text" class="sign__input" required>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">学生姓名</label>
                            <input style="width:100%" value="{{data.Name}}" name="name" type="text" class="sign__input" required>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">所属学校</label>
                            <input style="width:100%" placeholder="请输入学校名称" value="{{ data.SchoolName or '' }}" name="school_name" id="schoolName" type="text" class="sign__input" required>
                            <input type="hidden" name="school_id" id="schoolIdHidden" value="{{ data.SchoolId }}">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">所属班级</label>
                            <input style="width:100%" placeholder="请输入班级名称" value="{{ data.Classes or '' }}" name="class_name" id="className" type="text" class="sign__input" required>
                            <input type="hidden" name="class_id" id="classIdHidden" value="{{ data.ClassId }}">
                            <input type="hidden" name="classes" id="classesInput" value="{{ data.Classes }}">
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">学籍状态</label>
                            <select class="form-select" name="status" id="status" required>
                                <option value="1" {% if data.Status == 1 %}selected{% endif %}>在读</option>
                                <option value="0" {% if data.Status != 1 %}selected{% endif %}>停用</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">学号</label>
                            <input style="width:100%" value="{{data.Card}}" name="card" type="text" class="sign__input" required>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="sign__group">
                            <label class="form-label">联系电话</label>
                            <input style="width:100%" value="{{data.Phone}}" name="phone" type="text" class="sign__input" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="sign__group">
                            <label class="form-label">联系地址</label>
                            <input style="width:100%" value="{{data.Address}}" name="address" type="text" class="sign__input">
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="sign__btn sign__btn--small"><span>编辑学生</span></button>
                    </div>
                </div>

            </form>
        </div>
        <!-- end form -->
    </div>
</div>


            <script>
            (function() {
                // 同步手动输入的班级名称到隐藏字段
                const className = document.getElementById('className');
                const classesInput = document.getElementById('classesInput');
                if (className && classesInput) {
                  const sync = () => { classesInput.value = className.value.trim(); };
                  className.addEventListener('input', sync);
                  sync();
                }

                                // 输入学校/班级名称时，清空隐藏的ID，避免旧ID被误用
                                const schoolName = document.getElementById('schoolName');
                                const schoolIdHidden = document.getElementById('schoolIdHidden');
                                if (schoolName && schoolIdHidden) {
                                    schoolName.addEventListener('input', function(){ schoolIdHidden.value = ''; });
                                }
                                const classIdHidden = document.getElementById('classIdHidden');
                                if (className && classIdHidden) {
                                    className.addEventListener('input', function(){ classIdHidden.value = ''; });
                                }
            })();
            </script>





{% endblock %}
