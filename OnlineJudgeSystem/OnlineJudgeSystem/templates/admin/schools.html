{% extends 'adminLayout.html' %}
{% block title %}学校管理{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">学校管理</h4>
    <div>
      <button class="btn btn-primary" id="btnAdd">新增学校</button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="row g-3 align-items-end mb-3">
        <div class="col-auto">
          <label class="form-label">状态</label>
          <select class="form-select" id="statusFilter">
            <option value="">全部</option>
            <option value="1" selected>启用</option>
            <option value="0">禁用</option>
          </select>
        </div>
        <div class="col-auto">
          <button class="btn btn-secondary" id="btnRefresh">刷新</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle" id="tblSchools">
          <thead>
            <tr>
              <th>学校名称</th>
              <th>学校代码</th>
              <th>教师数</th>
              <th>学生数</th>
              <th>班级数</th>
              <th>待审核教师</th>
              <th>状态</th>
              <th>创建时间</th>
              <th style="width: 200px;">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑 模态框 -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">学校信息</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formEdit">
          <input type="hidden" id="schoolId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">学校名称</label>
              <input class="form-control" id="schoolName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">学校代码</label>
              <input class="form-control" id="schoolCode" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">省份</label>
              <input class="form-control" id="province">
            </div>
            <div class="col-md-6">
              <label class="form-label">城市</label>
              <input class="form-control" id="city">
            </div>
            <div class="col-md-12">
              <label class="form-label">地址</label>
              <input class="form-control" id="address">
            </div>
            <div class="col-md-4">
              <label class="form-label">联系人</label>
              <input class="form-control" id="contactPerson">
            </div>
            <div class="col-md-4">
              <label class="form-label">联系电话</label>
              <input class="form-control" id="contactPhone">
            </div>
            <div class="col-md-4">
              <label class="form-label">邮箱</label>
              <input class="form-control" id="email" type="email">
            </div>
            <div class="col-md-4">
              <label class="form-label">状态</label>
              <select class="form-select" id="status">
                <option value="1">启用</option>
                <option value="0">禁用</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const $tbl = $('#tblSchools tbody');
  const $statusFilter = $('#statusFilter');
  let editModal;

  function loadSchools() {
    const status = $statusFilter.val();
    const url = '/api/schools/list' + (status !== '' ? ('?status=' + status) : '');
    fetch(url)
      .then(r => r.json())
      .then(res => {
        if (res.code !== 1) { alert(res.msg || '加载失败'); return; }
        renderTable(res.data || []);
      });
  }

  function renderTable(list) {
    $tbl.empty();
    list.forEach(item => {
      const badge = item.status == 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">禁用</span>';
      const tr = `
        <tr>
          <td>${item.school_name || ''}</td>
          <td>${item.school_code || ''}</td>
          <td>${item.teacher_count || 0}</td>
          <td>${item.student_count || 0}</td>
          <td>${item.class_count || 0}</td>
          <td>${item.pending_teacher_count || 0}</td>
          <td>${badge}</td>
          <td>${item.created_at || ''}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="editSchool(${item.id})">编辑</button>
            <button class="btn btn-sm ${item.status==1?'btn-outline-secondary':'btn-outline-success'}" onclick="toggleStatus(${item.id}, ${item.status==1?0:1})">${item.status==1?'禁用':'启用'}</button>
          </td>
        </tr>`;
      $tbl.append(tr);
    });
  }

  window.editSchool = function(id) {
    fetch('/api/schools/detail/' + id)
      .then(r => r.json())
      .then(res => {
        if (res.code !== 1) { alert(res.msg || '加载失败'); return; }
        const d = res.data;
        $('#schoolId').val(d.id);
        $('#schoolName').val(d.school_name);
        $('#schoolCode').val(d.school_code);
        $('#province').val(d.province||'');
        $('#city').val(d.city||'');
        $('#address').val(d.address||'');
        $('#contactPerson').val(d.contact_person||'');
        $('#contactPhone').val(d.contact_phone||'');
        $('#email').val(d.email||'');
        $('#status').val(d.status||1);
        editModal = new bootstrap.Modal(document.getElementById('editModal'));
        editModal.show();
      });
  }

  window.toggleStatus = function(id, status) {
    fetch('/api/schools/toggle_status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status })
    }).then(r => r.json()).then(res => {
      if (res.code === 1) { loadSchools(); }
      else { alert(res.msg || '操作失败'); }
    })
  }

  $('#btnAdd').on('click', () => {
    $('#formEdit')[0].reset();
    $('#schoolId').val('');
    editModal = new bootstrap.Modal(document.getElementById('editModal'));
    editModal.show();
  });

  $('#btnSave').on('click', () => {
    const id = $('#schoolId').val();
    const payload = {
      school_name: $('#schoolName').val().trim(),
      school_code: $('#schoolCode').val().trim(),
      province: $('#province').val().trim(),
      city: $('#city').val().trim(),
      address: $('#address').val().trim(),
      contact_person: $('#contactPerson').val().trim(),
      contact_phone: $('#contactPhone').val().trim(),
      email: $('#email').val().trim(),
      status: parseInt($('#status').val()||'1',10)
    };
    if (!payload.school_name || !payload.school_code) { alert('请填写学校名称和代码'); return; }

    const url = id ? '/api/schools/update' : '/api/schools/add';
    if (id) { payload.id = parseInt(id,10); }

    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(r => r.json()).then(res => {
        if (res.code === 1) { editModal.hide(); loadSchools(); }
        else { alert(res.msg || '保存失败'); }
      });
  });

  $('#btnRefresh').on('click', loadSchools);
  $statusFilter.on('change', loadSchools);

  // 首次加载
  loadSchools();
})();
</script>
{% endblock %}
