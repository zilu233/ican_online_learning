{% extends 'adminLayout.html' %}
{% block title %}班级管理{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">班级管理</h4>
    <div>
      <button class="btn btn-primary" id="btnAdd">新增班级</button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="row g-3 align-items-end mb-3">
        <div class="col-md-3">
          <label class="form-label">学校</label>
          <select class="form-select" id="schoolFilter"></select>
        </div>
        <div class="col-auto">
          <button class="btn btn-secondary" id="btnRefresh">刷新</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle" id="tblClasses">
          <thead>
            <tr>
              <th>学校</th>
              <th>班级名称</th>
              <th>班级代码</th>
              <th>年级</th>
              <th>班主任</th>
              <th>学生数</th>
              <th>状态</th>
              <th style="width: 200px;">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑 模态框 -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">班级信息</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formEdit">
          <input type="hidden" id="classId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">学校</label>
              <select class="form-select" id="schoolId" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">班级名称</label>
              <input class="form-control" id="className" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">班级代码</label>
              <input class="form-control" id="classCode">
            </div>
            <div class="col-md-6">
              <label class="form-label">年级</label>
              <input class="form-control" id="grade">
            </div>
            <div class="col-md-6">
              <label class="form-label">班主任</label>
              <select class="form-select" id="teacherId"></select>
            </div>
            <div class="col-md-12">
              <label class="form-label">描述</label>
              <input class="form-control" id="description">
            </div>
            <div class="col-md-4">
              <label class="form-label">状态</label>
              <select class="form-select" id="status">
                <option value="1">启用</option>
                <option value="0">禁用</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const $tbl = $('#tblClasses tbody');
  let editModal;

  function loadSchools(selectId, cb) {
    fetch('/api/schools/all_active')
      .then(r => r.json()).then(res => {
        if (res.code !== 1) { alert(res.msg||'加载学校失败'); return; }
        const $sel = $('#' + selectId);
        $sel.empty();
        $sel.append('<option value="">请选择学校</option>');
        (res.data||[]).forEach(s => {
          $sel.append(`<option value="${s.id}">${s.school_name}</option>`);
        });
        cb && cb();
      })
  }

  function loadTeachers(schoolId) {
    return fetch('/api/teachers/by_school/' + schoolId)
      .then(r => r.json()).then(res => {
        const $sel = $('#teacherId');
        $sel.empty();
        $sel.append('<option value="">未指定</option>');
        if (res.code === 1) {
          (res.data||[]).forEach(t => {
            $sel.append(`<option value="${t.id}">${t.name||t.username}</option>`);
          });
        }
      });
  }

  function loadClasses() {
    const schoolId = $('#schoolFilter').val();
    const url = '/api/classes/list' + (schoolId? ('?school_id=' + schoolId) : '');
    fetch(url).then(r => r.json()).then(res => {
      if (res.code !== 1) { alert(res.msg || '加载失败'); return; }
      renderTable(res.data||[]);
    });
  }

  function renderTable(list) {
    $tbl.empty();
    list.forEach(item => {
      const badge = item.status == 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">禁用</span>';
      const tr = `
        <tr>
          <td>${item.school_name||''}</td>
          <td>${item.class_name||''}</td>
          <td>${item.class_code||''}</td>
          <td>${item.grade||''}</td>
          <td>${item.teacher_name||''}</td>
          <td>${item.student_count||0}</td>
          <td>${badge}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="editClass(${item.id})">编辑</button>
          </td>
        </tr>`;
      $tbl.append(tr);
    });
  }

  window.editClass = function(id) {
    Promise.all([
      new Promise(resolve => loadSchools('schoolId', resolve)),
      fetch('/api/classes/detail/' + id).then(r => r.json())
    ]).then(([_ , res]) => {
      if (res.code !== 1) { alert(res.msg || '加载失败'); return; }
      const d = res.data;
      $('#classId').val(d.id);
      $('#schoolId').val(d.school_id);
      $('#className').val(d.class_name);
      $('#classCode').val(d.class_code||'');
      $('#grade').val(d.grade||'');
      $('#description').val(d.description||'');
      $('#status').val(d.status||1);
      
      loadTeachers(d.school_id).then(() => {
        if (d.teacher_id) $('#teacherId').val(d.teacher_id);
      });
      
      editModal = new bootstrap.Modal(document.getElementById('editModal'));
      editModal.show();
    });
  }

  $('#btnAdd').on('click', () => {
    $('#formEdit')[0].reset();
    $('#classId').val('');
    loadSchools('schoolId');
    $('#teacherId').empty().append('<option value="">未指定</option>');
    editModal = new bootstrap.Modal(document.getElementById('editModal'));
    editModal.show();
  });

  $('#schoolId').on('change', function() {
    const sid = $(this).val();
    if (sid) loadTeachers(sid);
    else $('#teacherId').empty().append('<option value="">未指定</option>');
  });

  $('#btnSave').on('click', () => {
    const id = $('#classId').val();
    const payload = {
      school_id: parseInt($('#schoolId').val()||'0',10),
      class_name: $('#className').val().trim(),
      class_code: $('#classCode').val().trim(),
      grade: $('#grade').val().trim(),
      teacher_id: parseInt($('#teacherId').val()||'0',10),
      description: $('#description').val().trim(),
      status: parseInt($('#status').val()||'1',10)
    };
    if (!payload.school_id || !payload.class_name) { alert('请选择学校并填写班级名称'); return; }

    const url = id ? '/api/classes/update' : '/api/classes/add';
    if (id) payload.id = parseInt(id,10);

    fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(r => r.json()).then(res => {
        if (res.code === 1) { editModal.hide(); loadClasses(); }
        else { alert(res.msg || '保存失败'); }
      });
  });

  $('#btnRefresh').on('click', loadClasses);

  // 初始化
  loadSchools('schoolFilter', loadClasses);
})();
</script>
{% endblock %}
