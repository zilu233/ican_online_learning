{% extends 'adminLayout.html' %}
{% block title %}班级管理{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <style>
    /* 深色主题下增强模态表单的可读性 */
    #editModal .modal-content {
      background-color: #1f1f26; /* 与后台深色主题一致 */
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
    }
    #editModal .modal-header,
    #editModal .modal-footer {
      border-color: rgba(255,255,255,0.12);
    }
    #editModal .modal-title { color: #fff; }
    #editModal .btn-close { filter: invert(1); opacity: .8; }
    #editModal .btn-close:hover { opacity: 1; }

    #editModal .form-label { color: #fff !important; }
    #editModal .form-control,
    #editModal .form-select {
      color: #fff !important;
      background-color: #1f1f26 !important;
      border-color: rgba(255,255,255,0.25) !important;
    }
    #editModal .form-control::placeholder {
      color: rgba(255,255,255,0.7) !important;
    }
    #editModal #status,
    #editModal #status option,
    #editModal #teacherId,
    #editModal #teacherId option {
      color: #fff !important;
      background-color: #1f1f26 !important;
    }
  </style>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">班级管理</h4>
    <div>
  <button class="btn btn-primary" id="btnAdd" type="button">新增班级</button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="row g-3 align-items-end mb-3">
        <div class="col-auto">
          <button class="btn btn-secondary" id="btnRefresh">刷新</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle" id="tblClasses">
          <thead>
            <tr>
              <th>班级名称</th>
              <th>年级</th>
              <th>老师</th>
              <th>学生数</th>
              <th>状态</th>
              <th style="width: 220px;">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑 模态框 -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">班级信息</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formEdit">
          <input type="hidden" id="classId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">班级名称</label>
              <input class="form-control" id="className" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">班级代码</label>
              <input class="form-control" id="classCode">
            </div>
            <div class="col-md-6">
              <label class="form-label">年级</label>
              <input class="form-control" id="grade">
            </div>
            <div class="col-md-6">
              <label class="form-label">老师</label>
              <select class="form-select" id="teacherId"></select>
            </div>
            <div class="col-md-12">
              <label class="form-label">描述</label>
              <input class="form-control" id="description">
            </div>
            <div class="col-md-4">
              <label class="form-label">状态</label>
              <select class="form-select" id="status">
                <option value="1">启用</option>
                <option value="0">禁用</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
  <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">取消</button>
  <button class="btn btn-primary" id="btnSave" type="button">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const $tbl = $('#tblClasses tbody');
  const hasBootstrapModal = typeof $.fn.modal === 'function';

  // Fallback when Bootstrap's modal plugin is unavailable on this theme.
  function showModal() {
    if (hasBootstrapModal) {
      $('#editModal').modal('show');
      return;
    }
    const $modal = $('#editModal');
    // 追加到 body，避免受到父容器 overflow/层级影响
    if (!$modal.parent().is('body')) {
      $modal.appendTo('body');
    }
    if (!$modal.data('backdrop')) {
      const $backdrop = $('<div class="modal-backdrop fade" style="display:none;"></div>');
      $modal.after($backdrop);
      $modal.data('backdrop', $backdrop);
    }
    const $backdrop = $modal.data('backdrop');
    $('body').addClass('modal-open');
    // 兼容 Bootstrap4/5：使用 show 类；并强制 z-index
    $backdrop.show().addClass('show');
    $modal
      .attr('aria-modal', 'true')
      .removeAttr('aria-hidden')
      .css({ display: 'block', zIndex: 2000 })
      .addClass('show');
  }

  function hideModal() {
    if (hasBootstrapModal) {
      $('#editModal').modal('hide');
      return;
    }
    const $modal = $('#editModal');
    const $backdrop = $modal.data('backdrop');
    $modal.removeClass('show in').attr('aria-hidden','true').removeAttr('aria-modal').hide();
    if ($backdrop) {
      $backdrop.removeClass('show in').hide();
    }
    $('body').removeClass('modal-open');
  }

  $('#formEdit').on('submit', function(e) { e.preventDefault(); });
  $('[data-bs-dismiss="modal"]').on('click', function(e) {
    e.preventDefault();
    hideModal();
  });

  function loadTeachers() {
    // 无学校字段：加载所有已审核教师
    return fetch('/api/teachers/all_approved', { credentials: 'include' })
      .then(r => r.json()).then(res => {
        const $sel = $('#teacherId');
        $sel.empty();
        $sel.append('<option value="">未指定</option>');
        if (res.code === 1) {
          (res.data||[]).forEach(t => {
            $sel.append(`<option value="${t.id}">${t.name||t.username}</option>`);
          });
        }
      });
  }

  function loadClasses() {
    const url = '/api/classes/list';
    fetch(url, { credentials: 'include' }).then(r => r.json()).then(res => {
      if (res.code !== 1) { alert(res.msg || '加载失败'); return; }
      renderTable(res.data||[]);
    });
  }

  function renderTable(list) {
    $tbl.empty();
    list.forEach(item => {
      const badge = item.status == 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">禁用</span>';
      const tr = `
        <tr>
          <td>${item.class_name||''}</td>
          <td>${item.grade||''}</td>
          <td>${item.teacher_name||''}</td>
          <td>${item.student_count||0}</td>
          <td>${badge}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="editClass(${item.id})">编辑</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteClass(${item.id})">删除</button>
          </td>
        </tr>`;
      $tbl.append(tr);
    });
  }

  window.editClass = function(id) {
    fetch('/api/classes/detail/' + id, { credentials: 'include' }).then(r => r.json()).then(res => {
      if (res.code !== 1) { alert(res.msg || '加载失败'); return; }
      const d = res.data;
      $('#classId').val(d.id);
      $('#className').val(d.class_name);
      $('#classCode').val(d.class_code||'');
      $('#grade').val(d.grade||'');
      $('#description').val(d.description||'');
      $('#status').val(d.status||1);
      loadTeachers().then(() => {
        if (d.teacher_id) $('#teacherId').val(String(d.teacher_id));
      });

      showModal();
    });
  }

  window.deleteClass = function(id) {
    if (!id) return;
    if (!confirm('确定要删除该班级吗？')) return;
    fetch('/api/classes/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ id })
    }).then(r => r.json()).then(res => {
      if (res.code === 1) {
        loadClasses();
      } else {
        alert(res.msg || '删除失败');
      }
    });
  }

  $('#btnAdd').on('click', () => {
    $('#formEdit')[0].reset();
    $('#classId').val('');
    $('#status').val('1');
    $('#teacherId').empty().append('<option value="">未指定</option>');
    loadTeachers();
    showModal();
  });

  $('#btnSave').on('click', () => {
  const id = $('#classId').val();
    
    const payload = {
      class_name: $('#className').val().trim(),
      class_code: $('#classCode').val().trim(),
      grade: $('#grade').val().trim(),
      teacher_id: parseInt($('#teacherId').val()||'0',10),
      description: $('#description').val().trim(),
      status: parseInt($('#status').val()||'1',10)
    };
    if (!payload.class_name) { alert('请填写班级名称'); return; }

    const url = id ? '/api/classes/update' : '/api/classes/add';
    if (id) payload.id = parseInt(id,10);

    fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials: 'include',
      body: JSON.stringify(payload)
    })
      .then(r => r.json()).then(res => {
        if (res.code === 1) { hideModal(); loadClasses(); }
        else { alert(res.msg || '保存失败'); }
      });
  });

  $('#btnRefresh').on('click', loadClasses);

  // 初始化
  loadClasses();
})();
</script>
{% endblock %}
